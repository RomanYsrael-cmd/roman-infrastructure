---
- name: Install the restricted Roman deployment controller
  hosts: roman_servers
  become: true
  gather_facts: true
  vars:
    platform_root: /opt/roman-platform
    platform_config_dir: /etc/roman-platform
    platform_storage_root: /srv/apps/roman-platform
    node_exporter_textfile_dir: /srv/apps/monitoring/textfile_collector
    deploy_source_tailscale_ip: 100.104.209.82
    platform_repo_root: "{{ playbook_dir }}/../.."
    nginx_site_file: /etc/nginx/conf.d/roman-platform-smoke.conf
    nginx_route_file: /etc/roman-platform/nginx/active-smoke.conf
    romanlms_phase6_root: /srv/apps/romanlms-phase6
    romanlms_phase6_site_file: /etc/nginx/conf.d/romanlms-phase6-private.conf
    romanlms_phase6_route: /etc/roman-platform/nginx/active-romanlms-phase6.conf
    install_romanlms_phase6: false
    romanlms_production_root: /srv/apps/romanlms-production
    romanlms_production_site_file: /etc/nginx/conf.d/romanlms-production.conf
    romanlms_production_route: /etc/roman-platform/nginx/active-romanlms-production.conf
    install_romanlms_production: false
    provision_romanlms_production_alerts: false

  tasks:
    - name: Require a dedicated Ed25519 deployment public key
      ansible.builtin.assert:
        that:
          - deploy_public_key is defined
          - deploy_public_key is match('^ssh-ed25519 [A-Za-z0-9+/=]+')
        fail_msg: Pass only the deployment public key; never put a private key in this playbook.

    - name: Require the verified RomanLMS runner Tailscale address
      ansible.builtin.assert:
        that:
          - deploy_source_tailscale_ip == '100.104.209.82'
        fail_msg: Update deploy_source_tailscale_ip only after verifying the laptop runner's Tailscale address.

    - name: Require the applications SSD mount
      ansible.builtin.assert:
        that:
          - ansible_mounts | selectattr('mount', 'equalto', '/srv/apps') | list | length == 1
        fail_msg: /srv/apps is not mounted; no controller files will be installed.

    - name: Require the configured database and data storage mounts
      ansible.builtin.assert:
        that:
          - ansible_mounts | selectattr('mount', 'equalto', '/srv/databases') | list | length == 1
          - ansible_mounts | selectattr('mount', 'equalto', '/srv/data') | list | length == 1
        fail_msg: /srv/databases or /srv/data is not mounted; Phase 6 remains closed.
      when: install_romanlms_phase6 | bool

    - name: Read service state
      ansible.builtin.service_facts:

    - name: Require the existing Docker and Nginx services
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service'] is defined
          - ansible_facts.services['docker.service'].state == 'running'
          - ansible_facts.services['nginx.service'] is defined
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: Docker or Nginx is not healthy; install stopped before changing either service.

    - name: Read the configured Docker data root
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - "{{ '{{.DockerRootDir}}' }}"
      register: docker_root
      changed_when: false
      check_mode: false

    - name: Require Docker storage on the applications SSD
      ansible.builtin.assert:
        that:
          - docker_root.stdout is match('^/srv/apps(/|$)')
        fail_msg: Docker data is not on /srv/apps; controller installation is blocked.

    - name: Inspect the existing Node Exporter textfile collector directory
      ansible.builtin.stat:
        path: "{{ node_exporter_textfile_dir }}"
      register: textfile_directory

    - name: Require the existing root-owned monitoring collector path
      ansible.builtin.assert:
        that:
          - textfile_directory.stat.exists
          - textfile_directory.stat.isdir
          - textfile_directory.stat.pw_name == 'root'
          - textfile_directory.stat.gr_name == 'root'
          - textfile_directory.stat.mode == '0755'
        fail_msg: Existing Node Exporter collector path is unavailable or has unexpected ownership.

    - name: Check whether this private listener is already managed
      ansible.builtin.stat:
        path: "{{ nginx_site_file }}"
      register: platform_nginx_site

    - name: Check whether the private listener port is already occupied
      ansible.builtin.command:
        argv:
          - ss
          - -ltnH
          - sport
          - '='
          - :18080
      register: listener_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to claim an unrelated listener
      ansible.builtin.assert:
        that:
          - listener_check.stdout | trim == '' or platform_nginx_site.stat.exists
        fail_msg: Port 18080 is already in use and is not managed by this platform.

    - name: Check whether the Phase 6 private listener is already managed
      ansible.builtin.stat:
        path: "{{ romanlms_phase6_site_file }}"
      register: romanlms_phase6_nginx_site
      when: install_romanlms_phase6 | bool

    - name: Check whether the Phase 6 private listener port is already occupied
      ansible.builtin.command:
        argv:
          - ss
          - -ltnH
          - sport
          - '='
          - :18081
      register: romanlms_phase6_listener_check
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_romanlms_phase6 | bool

    - name: Refuse to claim an unrelated Phase 6 listener
      ansible.builtin.assert:
        that:
          - romanlms_phase6_listener_check.stdout | trim == '' or romanlms_phase6_nginx_site.stat.exists
        fail_msg: Port 18081 is already in use and is not managed by the Phase 6 private route.
      when: install_romanlms_phase6 | bool

    - name: Check whether the RomanLMS production listener is already managed
      ansible.builtin.stat:
        path: "{{ romanlms_production_site_file }}"
      register: romanlms_production_nginx_site
      when: install_romanlms_production | bool

    - name: Check whether the RomanLMS production listener port is occupied
      ansible.builtin.command:
        argv:
          - ss
          - -ltnH
          - sport
          - '='
          - :8081
      register: romanlms_production_listener_check
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_romanlms_production | bool

    - name: Refuse to claim an unrelated RomanLMS production listener
      ansible.builtin.assert:
        that:
          - romanlms_production_listener_check.stdout | trim == '' or romanlms_production_nginx_site.stat.exists
        fail_msg: Port 8081 is already in use and is not managed by the RomanLMS production gateway.
      when: install_romanlms_production | bool

    - name: Create root-owned controller directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ platform_root }}/bin", mode: "0755" }
        - { path: "{{ platform_root }}/controller", mode: "0755" }
        - { path: "{{ platform_config_dir }}/nginx", mode: "0750" }
        - { path: "{{ platform_storage_root }}/state", mode: "0750" }
        - { path: "{{ platform_storage_root }}/logs", mode: "0750" }
        - { path: /run/roman-platform, mode: "0700" }
        - { path: /run/lock/roman-platform, mode: "0750" }

    - name: Create root-owned Phase 6 directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ romanlms_phase6_root }}/state", mode: "0750" }
        - { path: "{{ romanlms_phase6_root }}/logs", mode: "0750" }
        - { path: "{{ platform_config_dir }}/romanlms-phase6", mode: "0700" }
        - { path: /etc/systemd/system/roman-monitoring-collector.service.d, mode: "0755" }
      when: install_romanlms_phase6 | bool

    - name: Create root-owned RomanLMS production directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ romanlms_production_root }}/state", mode: "0750" }
        - { path: "{{ romanlms_production_root }}/logs", mode: "0750" }
        - { path: "{{ platform_config_dir }}/romanlms-production", mode: "0700" }
        - { path: /etc/systemd/system/roman-monitoring-collector.service.d, mode: "0755" }
      when: install_romanlms_production | bool

    - name: Install the transactional notification-token key rotation helper
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/maintenance/rotate_notification_device_tokens.py"
        dest: "{{ platform_root }}/bin/rotate-notification-device-tokens"
        owner: root
        group: root
        mode: "0750"
      when: install_romanlms_production | bool

    - name: Validate the optional production Firebase service account
      tags: [romanlms-production-integrations]
      ansible.builtin.assert:
        that:
          - romanlms_firebase_service_account_json is mapping
          - romanlms_firebase_service_account_json.type == 'service_account'
          - romanlms_firebase_service_account_json.project_id is string
          - romanlms_firebase_service_account_json.project_id | length > 0
          - romanlms_firebase_service_account_json.client_email is string
          - romanlms_firebase_service_account_json.private_key is string
        fail_msg: The Firebase credential must be a complete service-account JSON object.
      no_log: true
      when: install_romanlms_production | bool and romanlms_firebase_service_account_json is defined

    - name: Validate the optional rotated notification-token encryption key
      ansible.builtin.assert:
        that:
          - romanlms_notification_token_encryption_key is string
          - romanlms_notification_token_encryption_key is match('^[A-Za-z0-9+/]{43}=$')
        fail_msg: The notification-token key must be Base64 for 32 bytes.
      no_log: true
      when: install_romanlms_production | bool and romanlms_notification_token_encryption_key is defined

    - name: Validate the optional production Resend API key
      tags: [romanlms-production-integrations]
      ansible.builtin.assert:
        that:
          - romanlms_resend_api_key is string
          - romanlms_resend_api_key | length >= 20
          - "'\\n' not in romanlms_resend_api_key"
          - "'\\r' not in romanlms_resend_api_key"
        fail_msg: The Resend API key is missing or invalid.
      no_log: true
      when: install_romanlms_production | bool and romanlms_resend_api_key is defined

    - name: Validate the optional production R2 credentials as a pair
      tags: [romanlms-production-integrations]
      ansible.builtin.assert:
        that:
          - romanlms_s3_access_key_id is defined
          - romanlms_s3_secret_access_key is defined
          - romanlms_s3_access_key_id is string
          - romanlms_s3_access_key_id | length >= 16
          - "'\\n' not in romanlms_s3_access_key_id"
          - "'\\r' not in romanlms_s3_access_key_id"
          - romanlms_s3_secret_access_key is string
          - romanlms_s3_secret_access_key | length >= 20
          - "'\\n' not in romanlms_s3_secret_access_key"
          - "'\\r' not in romanlms_s3_secret_access_key"
        fail_msg: Both production R2 credentials must be valid non-empty strings.
      no_log: true
      when: install_romanlms_production | bool and
        (romanlms_s3_access_key_id is defined or romanlms_s3_secret_access_key is defined)

    - name: Validate the optional production email sender address
      tags: [romanlms-production-integrations]
      ansible.builtin.assert:
        that:
          - romanlms_mail_from is string
          - romanlms_mail_from is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
        fail_msg: The production email sender address is invalid.
      no_log: true
      when: install_romanlms_production | bool and romanlms_mail_from is defined

    - name: Validate the optional production email sender name
      tags: [romanlms-production-integrations]
      ansible.builtin.assert:
        that:
          - romanlms_mail_from_name is string
          - romanlms_mail_from_name | length > 0
          - romanlms_mail_from_name | length <= 100
          - "'\\n' not in romanlms_mail_from_name"
          - "'\\r' not in romanlms_mail_from_name"
        fail_msg: The production email sender name is invalid.
      no_log: true
      when: install_romanlms_production | bool and romanlms_mail_from_name is defined

    - name: Preserve the production runtime environment before updating secrets
      tags: [romanlms-production-integrations]
      ansible.builtin.copy:
        src: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        dest: "{{ platform_config_dir }}/romanlms-production/runtime.env.backup-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and
        (romanlms_firebase_service_account_json is defined or romanlms_notification_token_encryption_key is defined or romanlms_resend_api_key is defined or romanlms_s3_access_key_id is defined or romanlms_s3_secret_access_key is defined)

    - name: Preserve the original token-key environment for transaction rollback
      ansible.builtin.copy:
        src: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        dest: "{{ platform_config_dir }}/romanlms-production/runtime.env.backup-before-token-rotation"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_notification_token_encryption_key is defined

    - name: Install the protected next notification-token encryption key
      ansible.builtin.copy:
        content: "{{ romanlms_notification_token_encryption_key }}\n"
        dest: "{{ platform_config_dir }}/romanlms-production/notification-token-key.next"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_notification_token_encryption_key is defined

    - name: Install the production Firebase service-account credential
      tags: [romanlms-production-integrations]
      ansible.builtin.copy:
        content: "{{ romanlms_firebase_service_account_json | to_nice_json }}\n"
        dest: "{{ platform_config_dir }}/romanlms-production/firebase-service-account.json"
        owner: root
        group: "10001"
        mode: "0440"
      no_log: true
      when: install_romanlms_production | bool and romanlms_firebase_service_account_json is defined

    - name: Verify the notification-token rotation cryptography before changing runtime configuration
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ platform_repo_root }}/deploy/maintenance/rotate_notification_device_tokens.py"
          - --self-test
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      when: install_romanlms_production | bool and romanlms_notification_token_encryption_key is defined

    - name: Configure the production Firebase project ID
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^FIREBASE_PROJECT_ID='
        line: "FIREBASE_PROJECT_ID={{ romanlms_firebase_service_account_json.project_id }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_firebase_service_account_json is defined

    - name: Configure the production Firebase credentials mount path
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^GOOGLE_APPLICATION_CREDENTIALS='
        line: "GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_firebase_service_account_json is defined

    - name: Require production Firebase credentials before enabling FCM
      tags: [romanlms-production-integrations]
      ansible.builtin.assert:
        that:
          - romanlms_firebase_service_account_json is defined
          - romanlms_fcm_enabled | bool
        fail_msg: FCM requires a service-account credential and an explicit enable flag.
      no_log: true
      when: install_romanlms_production | bool and romanlms_fcm_enabled | default(false) | bool

    - name: Set production FCM enablement only when explicitly requested
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^ROMANLMS_NOTIFICATIONS_FCM_ENABLED='
        line: "ROMANLMS_NOTIFICATIONS_FCM_ENABLED={{ 'true' if romanlms_fcm_enabled | bool else 'false' }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_fcm_enabled is defined

    - name: Install the rotated production notification-token encryption key
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^NOTIFICATION_DEVICE_TOKEN_ENCRYPTION_KEY='
        line: "NOTIFICATION_DEVICE_TOKEN_ENCRYPTION_KEY={{ romanlms_notification_token_encryption_key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_notification_token_encryption_key is defined

    - name: Install the production Resend API key
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^RESEND_API='
        line: "RESEND_API={{ romanlms_resend_api_key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_resend_api_key is defined

    - name: Install the production R2 S3 access key
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^S3_ACCESS_KEY_ID='
        line: "S3_ACCESS_KEY_ID={{ romanlms_s3_access_key_id }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_s3_access_key_id is defined and romanlms_s3_secret_access_key is defined

    - name: Install the production R2 S3 secret key
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^S3_SECRET_ACCESS_KEY='
        line: "S3_SECRET_ACCESS_KEY={{ romanlms_s3_secret_access_key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_s3_access_key_id is defined and romanlms_s3_secret_access_key is defined

    - name: Configure the production transactional email sender address
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^ROMANLMS_MAIL_FROM='
        line: "ROMANLMS_MAIL_FROM={{ romanlms_mail_from }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_mail_from is defined

    - name: Configure the production transactional email sender name
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^ROMANLMS_MAIL_FROM_NAME='
        line: "ROMANLMS_MAIL_FROM_NAME={{ romanlms_mail_from_name }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_mail_from_name is defined

    - name: Enable production transactional email after installing its provider key
      tags: [romanlms-production-integrations]
      ansible.builtin.lineinfile:
        path: "{{ platform_config_dir }}/romanlms-production/runtime.env"
        regexp: '^ROMANLMS_MAIL_ENABLED='
        line: "ROMANLMS_MAIL_ENABLED=true"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: install_romanlms_production | bool and romanlms_resend_api_key is defined and
        romanlms_mail_from is defined and romanlms_mail_from_name is defined

    - name: Install the Python controller
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/controller/roman_deploy.py"
        dest: "{{ platform_root }}/controller/roman_deploy.py"
        owner: root
        group: root
        mode: "0644"
      tags: [romanlms-recovery-controller]

    - name: Install the RomanLMS LONG and SHORT CI proof verifier
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/controller/romanlms_ci_gate.py"
        dest: "{{ platform_root }}/controller/romanlms_ci_gate.py"
        owner: root
        group: root
        mode: "0644"
      tags: [romanlms-recovery-controller]

    - name: Install the restricted command wrapper
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/controller/bin/roman-deploy"
        dest: "{{ platform_root }}/bin/roman-deploy"
        owner: root
        group: root
        mode: "0755"

    - name: Install the pre-sudo forced-command gate
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/controller/bin/roman-deploy-ssh"
        dest: "{{ platform_root }}/bin/roman-deploy-ssh"
        owner: root
        group: root
        mode: "0755"

    - name: Install the idempotent deployment alert provisioner
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/monitoring/provision_grafana_alerts.py"
        dest: "{{ platform_root }}/bin/provision-grafana-alerts"
        owner: root
        group: root
        mode: "0750"

    - name: Install the isolated Phase 6 restore bootstrap
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/staging/prepare_romanlms_phase6.py"
        dest: "{{ platform_root }}/bin/prepare-romanlms-phase6"
        owner: root
        group: root
        mode: "0750"
      when: install_romanlms_phase6 | bool

    - name: Install the mount-checked Phase 6 startup helper
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/staging/start_romanlms_phase6.py"
        dest: "{{ platform_root }}/bin/start-romanlms-phase6"
        owner: root
        group: root
        mode: "0750"
      when: install_romanlms_phase6 | bool

    - name: Install the bounded private application metric collector
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/monitoring/collect_romanlms_phase6.py"
        dest: "{{ platform_root }}/bin/collect-romanlms-phase6"
        owner: root
        group: root
        mode: "0750"
      when: install_romanlms_phase6 | bool

    - name: Install the bounded production application metric collector
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/deploy/monitoring/collect_romanlms_production.py"
        dest: "{{ platform_root }}/bin/collect-romanlms-production"
        owner: root
        group: root
        mode: "0750"
      when: install_romanlms_production | bool

    - name: Add private application metrics to the existing collector schedule
      ansible.builtin.copy:
        dest: /etc/systemd/system/roman-monitoring-collector.service.d/romanlms-phase6.conf
        content: "[Service]\nTimeoutStartSec=150s\nExecStart=-/usr/bin/python3 {{ platform_root }}/bin/collect-romanlms-phase6\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd manager
      when: install_romanlms_phase6 | bool

    - name: Add production application metrics to the existing collector schedule
      ansible.builtin.copy:
        dest: /etc/systemd/system/roman-monitoring-collector.service.d/romanlms-production.conf
        content: "[Service]\nTimeoutStartSec=150s\nExecStart=-/usr/bin/python3 {{ platform_root }}/bin/collect-romanlms-production\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd manager
      when: install_romanlms_production | bool

    - name: Install the mount-checked Phase 6 startup service
      ansible.builtin.template:
        src: templates/romanlms-phase6.service.j2
        dest: /etc/systemd/system/romanlms-phase6.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd manager
      when: install_romanlms_phase6 | bool

    - name: Install the server allowlist
      ansible.builtin.copy:
        src: "{{ platform_repo_root }}/platform/applications.json"
        dest: "{{ platform_config_dir }}/applications.json"
        owner: root
        group: root
        mode: "0644"
      tags: [romanlms-recovery-controller]

    - name: Create the restricted deployment account
      ansible.builtin.user:
        name: roman-deploy
        comment: Restricted Roman platform deploy request account
        system: true
        create_home: true
        home: /var/lib/roman-deploy
        shell: /bin/sh
        password_lock: true
        state: present

    - name: Create the deployment account SSH directory
      ansible.builtin.file:
        path: /var/lib/roman-deploy/.ssh
        state: directory
        owner: roman-deploy
        group: roman-deploy
        mode: "0700"

    - name: Install the forced-command deployment public key
      ansible.builtin.template:
        src: templates/authorized_keys.j2
        dest: /var/lib/roman-deploy/.ssh/authorized_keys
        owner: roman-deploy
        group: roman-deploy
        mode: "0600"

    - name: Install the single-command sudo rule
      ansible.builtin.copy:
        dest: /etc/sudoers.d/roman-platform-deploy
        owner: root
        group: root
        mode: "0440"
        content: "roman-deploy ALL=(root) NOPASSWD: {{ platform_root }}/bin/roman-deploy --ssh\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Create a closed route before any application is deployed
      ansible.builtin.copy:
        dest: "{{ nginx_route_file }}"
        content: "return 503;\n"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Create a closed Phase 6 application route
      ansible.builtin.copy:
        dest: "{{ romanlms_phase6_route }}"
        content: "return 503;\n"
        owner: root
        group: root
        mode: "0644"
        force: false
      when: install_romanlms_phase6 | bool

    - name: Create a closed RomanLMS production route
      ansible.builtin.copy:
        dest: "{{ romanlms_production_route }}"
        content: "return 503;\n"
        owner: root
        group: root
        mode: "0644"
        force: false
      when: install_romanlms_production | bool

    - name: Install an isolated loopback-only Nginx listener
      ansible.builtin.template:
        src: templates/roman-platform-smoke.conf.j2
        dest: "{{ nginx_site_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload Roman platform Nginx

    - name: Install an isolated loopback-only RomanLMS Phase 6 listener
      ansible.builtin.template:
        src: templates/romanlms-phase6-private.conf.j2
        dest: "{{ romanlms_phase6_site_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload Roman platform Nginx
      when: install_romanlms_phase6 | bool

    - name: Install the loopback-only RomanLMS production gateway
      ansible.builtin.template:
        src: templates/romanlms-production.conf.j2
        dest: "{{ romanlms_production_site_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload Roman platform Nginx
      when: install_romanlms_production | bool

    - name: Apply and validate the private Nginx listener before alert setup
      ansible.builtin.meta: flush_handlers

    - name: Add deployment outcome rules to the existing Telegram route
      ansible.builtin.command: >-
        {{ platform_root }}/bin/provision-grafana-alerts
        {{ '--include-phase6' if install_romanlms_phase6 | bool else '' }}
        {{ '--include-production' if provision_romanlms_production_alerts | bool else '' }}
      register: deployment_alert_setup
      changed_when: "'changed=true' in deployment_alert_setup.stdout"

  handlers:
    - name: Reload systemd manager
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      check_mode: false
      listen: Reload Roman platform Nginx

    - name: Reload Nginx without restarting it
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload Roman platform Nginx
