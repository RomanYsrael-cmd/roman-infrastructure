name: RomanLMS smoke compatibility adapter to registered deployment

on:
  workflow_call:
    inputs:
      confirmation:
        description: Exact authorization phrase from the RomanLMS smoke caller
        required: true
        type: string
      operation:
        description: Deploy, roll back, or submit a fixed unhealthy fixture for server rejection
        required: true
        type: string
      platform_ref:
        description: Full infrastructure commit SHA pinned by the caller
        required: true
        type: string
    secrets:
      ROMAN_PLATFORM_SSH_PRIVATE_KEY:
        required: true
      ROMAN_PLATFORM_SSH_KNOWN_HOSTS:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: write
  id-token: write

concurrency:
  group: roman-platform-production
  cancel-in-progress: false

jobs:
  delegate-registered-smoke:
    if: >-
      github.repository == 'RomanYsrael-cmd/roman-lms' &&
      github.actor == 'RomanYsrael-cmd' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.operation == 'deploy' && inputs.confirmation == 'DEPLOY SMOKE') ||
       (inputs.operation == 'unhealthy-test' && inputs.confirmation == 'TEST UNHEALTHY SMOKE') ||
       (inputs.operation == 'rollback' && inputs.confirmation == 'ROLLBACK SMOKE'))
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-application.yml
    with:
      app_id: platform-smoke
      confirmation: ${{ (inputs.operation == 'deploy' && 'DEPLOY PLATFORM SMOKE') || (inputs.operation == 'unhealthy-test' && 'TEST UNHEALTHY PLATFORM SMOKE') || 'ROLLBACK PLATFORM SMOKE' }}
      operation: ${{ inputs.operation }}
      platform_ref: ${{ inputs.platform_ref }}
      release_mode: manual
    secrets:
      ROMAN_PLATFORM_SSH_PRIVATE_KEY: ${{ secrets.ROMAN_PLATFORM_SSH_PRIVATE_KEY }}
      ROMAN_PLATFORM_SSH_KNOWN_HOSTS: ${{ secrets.ROMAN_PLATFORM_SSH_KNOWN_HOSTS }}
