name: Roman platform smoke deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Choose one isolated smoke deployment, rollback, or unhealthy-candidate test
        required: true
        type: choice
        options:
          - CANCEL
          - DEPLOY SMOKE
          - ROLLBACK SMOKE
          - TEST UNHEALTHY SMOKE

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  smoke-deploy:
    if: >-
      github.repository == 'RomanYsrael-cmd/roman-lms' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY SMOKE'
    uses: RomanYsrael-cmd/roman-infrastructure/.github/workflows/romanlms-smoke-deploy.yml@ed7f0067b23bb5b1e0126c8c783ee63066d6e025
    with:
      confirmation: ${{ inputs.confirmation }}
      operation: deploy
      platform_ref: ed7f0067b23bb5b1e0126c8c783ee63066d6e025
    secrets:
      ROMAN_PLATFORM_SSH_PRIVATE_KEY: ${{ secrets.ROMAN_PLATFORM_SSH_PRIVATE_KEY }}
      ROMAN_PLATFORM_SSH_KNOWN_HOSTS: ${{ secrets.ROMAN_PLATFORM_SSH_KNOWN_HOSTS }}

  smoke-rollback:
    if: >-
      github.repository == 'RomanYsrael-cmd/roman-lms' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ROLLBACK SMOKE'
    uses: RomanYsrael-cmd/roman-infrastructure/.github/workflows/romanlms-smoke-deploy.yml@ed7f0067b23bb5b1e0126c8c783ee63066d6e025
    with:
      confirmation: ROLLBACK SMOKE
      operation: rollback
      platform_ref: ed7f0067b23bb5b1e0126c8c783ee63066d6e025
    secrets:
      ROMAN_PLATFORM_SSH_PRIVATE_KEY: ${{ secrets.ROMAN_PLATFORM_SSH_PRIVATE_KEY }}
      ROMAN_PLATFORM_SSH_KNOWN_HOSTS: ${{ secrets.ROMAN_PLATFORM_SSH_KNOWN_HOSTS }}

  smoke-unhealthy-test:
    if: >-
      github.repository == 'RomanYsrael-cmd/roman-lms' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'TEST UNHEALTHY SMOKE'
    uses: RomanYsrael-cmd/roman-infrastructure/.github/workflows/romanlms-smoke-deploy.yml@ed7f0067b23bb5b1e0126c8c783ee63066d6e025
    with:
      confirmation: TEST UNHEALTHY SMOKE
      operation: unhealthy-test
      platform_ref: ed7f0067b23bb5b1e0126c8c783ee63066d6e025
    secrets:
      ROMAN_PLATFORM_SSH_PRIVATE_KEY: ${{ secrets.ROMAN_PLATFORM_SSH_PRIVATE_KEY }}
      ROMAN_PLATFORM_SSH_KNOWN_HOSTS: ${{ secrets.ROMAN_PLATFORM_SSH_KNOWN_HOSTS }}
